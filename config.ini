[Network]
Interface       = enp0s3       ; Name of network interface to monitor
Filter          = tcp          ; BPF filter string

[Detection]
RateLimit       = 50           ; Packets/sec threshold per source IP
WindowSeconds   = 1            ; Sampling window in seconds

[Mitigation]
EnableMitigation = yes         ; yes/no
BlockDuration   = 600          ; Seconds to keep an IP blocked
IptablesChain   = INPUT        ; Chain to modify (INPUT/FORWARD/OUTPUT)

[ThreatIntel]
FeedURL         =              ; e.g. https://feeds.example.com/badips.json
UpdateInterval  = 3600         ; Seconds between feed refreshes

[Alerts]
EmailAlert      = yes          ; yes/no
SMTPServer      = smtp.example.com
SMTPPort        = 587
EmailFrom       = monitor@yourdomain.com
EmailTo         = admin@yourdomain.com
EmailUser       = smtp_user
EmailPass       = smtp_pass

[GUI]
RefreshInterval = 1000         ; GUI chart refresh ms
Theme           = dark         ; light or dark
